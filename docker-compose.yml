version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cpd-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: cpd_user
      POSTGRES_PASSWORD: cpd_password
      POSTGRES_DB: client_project_dashboard
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cpd_user -d client_project_dashboard']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
